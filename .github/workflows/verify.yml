name: Verify site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check local links
        run: python3 scripts/check_site_links.py _site
